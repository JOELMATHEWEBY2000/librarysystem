<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login | Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .login-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        .login-body {
            padding: 30px;
            background: white;
        }

        .form-control {
            padding: 11px;
            border-radius: 6px;
        }

        .login-btn {
            padding: 12px;
            font-weight: 600;
            border-radius: 6px;
        }

        .register-link {
            color: #0d6efd;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-wrapper">
    <div class="card login-card">

        <div class="login-header">
            <h2 class="mb-2">Member Login</h2>
            <p class="mb-0">Library Management System</p>
        </div>

        <div class="login-body">

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'member_login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 login-btn">
                    Login
                </button>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0">
                Don't have an account?
                <a href="{% url 'register' %}" class="register-link">
                    Register here
                </a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
