
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email OTP</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 450px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Email Verification</h4>
        </div>

        <div class="card-body">
            <p>Enter the six-digit OTP sent to your registered email.</p>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="otp" class="form-label">
                        Six-digit OTP
                    </label>
                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="form-control"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        minlength="6"
                        autocomplete="one-time-code"
                        placeholder="Enter OTP"
                        required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Verify Email
                </button>
            </form>
            <form method="POST" action="{% url 'resend_otp' %}" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-secondary w-100">
        Resend OTP
    </button>
</form>

{% if message %}
    <div class="alert alert-success mt-3">{{ message }}</div>
{% endif %}
        </div>
    </div>
</div>

</body>
</html>
